<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hang On</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.hint { margin: 0 0 20px; opacity: .7; }
    label.toggle { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 6px 8px; font: inherit; }
    button { font: inherit; padding: 6px 12px; cursor: pointer; }
    #error { color: #c62828; min-height: 1.5em; margin: 6px 0; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(128,128,128,.3); }
    li code { flex: 1; word-break: break-all; }
    .inactive { font-size: 12px; color: #b26a00; }
    .empty { opacity: .6; }
  </style>
</head>
<body>
  <h1>Hang On</h1>
  <p class="hint">On these sites, closing the tab (X, Cmd+W, middle-click) while a call is in progress asks
    for confirmation first. Changes apply to pages you load or reload afterwards.</p>

  <label class="toggle"><input type="checkbox" id="enabled"> Enabled</label>

  <form id="add-form">
    <input type="text" id="pattern" placeholder="meet.google.com  or  *.zoom.us" autocomplete="off" spellcheck="false">
    <button type="submit">Add site</button>
  </form>
  <div id="error" role="alert"></div>

  <ul id="list"></ul>
  <script src="options.js"></script>
</body>
</html>
